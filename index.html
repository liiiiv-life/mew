<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: 모바일 키보드가 뜨면 레이아웃 뷰포트(및 dvh)가 실제로 줄어들게 함 (Chromium) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>mew</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- 저장된 라이트/다크 선호를 React가 뜨기 전에 적용해 첫 렌더에서 테마가 깜빡이는 것을 막는다 -->
    <script>
      try {
        if (localStorage.getItem('mew:theme') === 'light') document.documentElement.classList.remove('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
